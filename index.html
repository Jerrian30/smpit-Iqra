<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Simulasi Ujian Informatika SMP</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
background:linear-gradient(135deg,#4facfe,#00f2fe);
min-height:100vh;
padding:20px;
}

.container{
max-width:1000px;
margin:auto;
background:white;
border-radius:20px;
padding:25px;
box-shadow:0 10px 30px rgba(0,0,0,0.2);
}

header{
text-align:center;
margin-bottom:20px;
}

header h1{
color:#1e3a8a;
margin-bottom:10px;
}

.info{
display:flex;
justify-content:space-between;
align-items:center;
flex-wrap:wrap;
gap:10px;
margin-bottom:20px;
}

.timer{
background:#ef4444;
color:white;
padding:10px 20px;
border-radius:10px;
font-weight:bold;
}

.progress-container{
width:100%;
height:18px;
background:#ddd;
border-radius:20px;
overflow:hidden;
margin-bottom:20px;
}

.progress-bar{
height:100%;
width:0%;
background:linear-gradient(to right,#10b981,#22c55e);
transition:0.3s;
}

.question-box{
margin-bottom:20px;
}

.question-number{
font-size:18px;
font-weight:bold;
margin-bottom:10px;
color:#1e3a8a;
}

.question{
font-size:18px;
margin-bottom:15px;
line-height:1.5;
}

.option{
background:#f3f4f6;
padding:12px;
margin-bottom:10px;
border-radius:10px;
cursor:pointer;
transition:0.3s;
border:2px solid transparent;
}

.option:hover{
background:#dbeafe;
}

.option input{
margin-right:10px;
}

.buttons{
display:flex;
justify-content:space-between;
margin-top:20px;
flex-wrap:wrap;
gap:10px;
}

button{
padding:12px 20px;
border:none;
border-radius:10px;
cursor:pointer;
font-size:16px;
font-weight:bold;
transition:0.3s;
}

.prev-btn{
background:#6b7280;
color:white;
}

.next-btn{
background:#2563eb;
color:white;
}

.submit-btn{
background:#16a34a;
color:white;
}

button:hover{
transform:scale(1.03);
opacity:0.9;
}

.result-container{
display:none;
}

.result-box{
text-align:center;
padding:20px;
background:#f8fafc;
border-radius:20px;
margin-bottom:20px;
}

.score{
font-size:50px;
color:#16a34a;
font-weight:bold;
}

.correct{
background:#dcfce7 !important;
border:2px solid #22c55e !important;
}

.wrong{
background:#fee2e2 !important;
border:2px solid #ef4444 !important;
}

.review-box{
margin-top:20px;
padding:20px;
border-radius:15px;
background:#f9fafb;
}

.review-question{
margin-bottom:25px;
padding-bottom:15px;
border-bottom:1px solid #ddd;
}

.review-question h3{
margin-bottom:10px;
}

.explanation{
margin-top:10px;
background:#eff6ff;
padding:10px;
border-radius:10px;
}

@media(max-width:768px){
.question{
font-size:16px;
}

button{
width:100%;
}
}
</style>
</head>
<body>

<div class="container">

<header>
<h1>Simulasi Ujian Informatika SMP</h1>
<p>Kelas VIII Semester Genap</p>
</header>

<div id="quiz-container">

<div class="info">
<div><strong>Jumlah Soal:</strong> 40</div>
<div class="timer" id="timer">60:00</div>
</div>

<div class="progress-container">
<div class="progress-bar" id="progressBar"></div>
</div>

<div class="question-box">
<div class="question-number" id="question-number"></div>
<div class="question" id="question"></div>
<div id="options"></div>
</div>

<div class="buttons">
<button class="prev-btn" onclick="prevQuestion()">Previous</button>
<button class="next-btn" onclick="nextQuestion()">Next</button>
<button class="submit-btn" onclick="submitQuiz()">Submit</button>
</div>

</div>

<div class="result-container" id="result-container">

<div class="result-box">
<h2>Hasil Ujian</h2>
<div class="score" id="score"></div>
<p id="summary"></p>
</div>

<div id="review"></div>

</div>

</div>

<script>

const questions = [

{
question:"Bahasa pemrograman prosedural mulai populer pada tahun....",
options:["1960-an","1980-an","2000-an","2015"],
answer:"1960-an",
explanation:"Bahasa pemrograman prosedural mulai berkembang dan populer sekitar tahun 1960-an."
},

{
question:"Bentuk penyusunan data pada Microsoft Excel disebut....",
options:["Baris dan kolom","Slide","Paragraf","Layer"],
answer:"Baris dan kolom",
explanation:"Data di Excel disusun dalam bentuk baris dan kolom."
},

{
question:"Cell pada Microsoft Excel adalah....",
options:["Gabungan workbook","Kotak tempat memasukkan data","Kumpulan sheet","Menu utama"],
answer:"Kotak tempat memasukkan data",
explanation:"Cell adalah perpotongan antara baris dan kolom."
},

{
question:"Generalisasi dalam berpikir komputasional berarti....",
options:["Mengelompokkan pola yang sama","Menghapus data","Menggambar tabel","Menyimpan file"],
answer:"Mengelompokkan pola yang sama",
explanation:"Generalisasi digunakan untuk menemukan pola yang serupa."
},

{
question:"Mengurutkan data dari kecil ke besar disebut....",
options:["Ascending","Delete","Filtering","Descending"],
answer:"Ascending",
explanation:"Ascending berarti urutan naik dari kecil ke besar."
},

{
question:"Tujuan visualisasi data adalah....",
options:["Mempermudah memahami data","Menghapus data","Menggandakan data","Mematikan komputer"],
answer:"Mempermudah memahami data",
explanation:"Visualisasi membantu data lebih mudah dipahami."
},

{
question:"Transformasi data adalah proses....",
options:["Mengubah bentuk data","Menghapus semua data","Membuat game","Mematikan aplikasi"],
answer:"Mengubah bentuk data",
explanation:"Transformasi data digunakan untuk mengubah format atau bentuk data."
},

{
question:"Fitur Shapes pada Microsoft Office digunakan untuk....",
options:["Membuat bentuk","Menambah suara","Menghapus sheet","Mengganti wallpaper"],
answer:"Membuat bentuk",
explanation:"Shapes digunakan membuat objek bentuk seperti lingkaran dan kotak."
},

{
question:"Tujuan analisis data adalah....",
options:["Mendapatkan informasi","Menghapus data","Mengganti warna","Menutup aplikasi"],
answer:"Mendapatkan informasi",
explanation:"Analisis data bertujuan memperoleh informasi dari data."
},

{
question:"Database adalah....",
options:["Kumpulan data","Kumpulan gambar","Kumpulan lagu","Kumpulan video"],
answer:"Kumpulan data",
explanation:"Database merupakan kumpulan data yang tersusun rapi."
},

{
question:"Alamat website resmi Scratch adalah....",
options:["scratch.mit.edu","google.com","excel.com","office.net"],
answer:"scratch.mit.edu",
explanation:"Website resmi Scratch adalah scratch.mit.edu."
},

{
question:"Fungsi Scratch adalah untuk....",
options:["Membuat animasi dan game","Mengedit video","Membuat tabel","Mencetak dokumen"],
answer:"Membuat animasi dan game",
explanation:"Scratch digunakan untuk belajar coding dan membuat animasi."
},

{
question:"Program aplikasi berfungsi untuk....",
options:["Membantu pekerjaan pengguna","Menghidupkan listrik","Membuat CPU","Menambah RAM"],
answer:"Membantu pekerjaan pengguna",
explanation:"Aplikasi digunakan untuk membantu pekerjaan tertentu."
},

{
question:"Algoritma adalah....",
options:["Langkah-langkah menyelesaikan masalah","Jenis komputer","Perangkat keras","Bahasa Inggris"],
answer:"Langkah-langkah menyelesaikan masalah",
explanation:"Algoritma merupakan urutan langkah logis."
},

{
question:"Kekurangan Scratch adalah....",
options:["Fitur terbatas","Sulit digunakan","Tidak memiliki blok","Tidak dapat dijalankan"],
answer:"Fitur terbatas",
explanation:"Scratch memiliki keterbatasan dibanding bahasa pemrograman profesional."
},

{
question:"Kata komputer berasal dari kata compute yang berarti....",
options:["Menghitung","Menggambar","Menulis","Membaca"],
answer:"Menghitung",
explanation:"Compute berarti menghitung."
},

{
question:"Informatika adalah ilmu yang mempelajari....",
options:["Pengolahan informasi menggunakan komputer","Olahraga","Musik","Pertanian"],
answer:"Pengolahan informasi menggunakan komputer",
explanation:"Informatika mempelajari pengolahan informasi berbasis teknologi."
},

{
question:"Yang termasuk software adalah....",
options:["Microsoft Word","Keyboard","Monitor","Mouse"],
answer:"Microsoft Word",
explanation:"Microsoft Word merupakan perangkat lunak."
},

{
question:"Tanda '=' pada Excel digunakan untuk....",
options:["Mengawali rumus","Menghapus data","Mengganti warna","Menutup workbook"],
answer:"Mengawali rumus",
explanation:"Rumus Excel selalu diawali tanda '='."
},

{
question:"Workbook pada Excel berarti....",
options:["Buku kerja","Lembar tunggal","Kotak data","File gambar"],
answer:"Buku kerja",
explanation:"Workbook adalah file kerja Excel."
},

{
question:"Penulisan rumus Excel yang benar adalah....",
options:["=SUM(A1:A5)","SUM(A1:A5)","SUM=A1:A5","A1+A5="],
answer:"=SUM(A1:A5)",
explanation:"Rumus Excel harus diawali '='."
},

{
question:"Langkah awal membuat program adalah....",
options:["Menentukan masalah","Mencetak dokumen","Memasang speaker","Menghapus data"],
answer:"Menentukan masalah",
explanation:"Program dibuat setelah mengetahui masalah yang akan diselesaikan."
},

{
question:"Dampak bullying digital adalah....",
options:["Korban merasa sedih","Menambah semangat","Mempercepat internet","Menghemat listrik"],
answer:"Korban merasa sedih",
explanation:"Bullying dapat berdampak buruk pada mental korban."
},

{
question:"UU cyberlaw di Indonesia dikenal dengan....",
options:["UU ITE","UU Pajak","UU Pendidikan","UU Kesehatan"],
answer:"UU ITE",
explanation:"Cyberlaw di Indonesia diatur dalam UU ITE."
},

{
question:"Dunia virtual adalah....",
options:["Dunia berbasis digital","Dunia nyata","Tempat wisata","Gedung sekolah"],
answer:"Dunia berbasis digital",
explanation:"Dunia virtual merupakan lingkungan digital."
},

{
question:"Content communities pada media sosial digunakan untuk....",
options:["Berbagi konten","Belanja","Mencetak buku","Membuat listrik"],
answer:"Berbagi konten",
explanation:"Content communities memungkinkan berbagi konten."
},

{
question:"Media sosial adalah....",
options:["Sarana komunikasi online","Mesin hitung","Perangkat keras","Program antivirus"],
answer:"Sarana komunikasi online",
explanation:"Media sosial digunakan untuk berinteraksi melalui internet."
},

{
question:"Ciri media sosial adalah....",
options:["Dapat berinteraksi","Tidak bisa online","Tidak ada pengguna","Tidak memakai internet"],
answer:"Dapat berinteraksi",
explanation:"Media sosial memungkinkan interaksi antar pengguna."
},

{
question:"Bullying adalah....",
options:["Tindakan menyakiti orang lain","Kegiatan olahraga","Belajar kelompok","Menolong teman"],
answer:"Tindakan menyakiti orang lain",
explanation:"Bullying merupakan tindakan menyakiti fisik atau mental."
},

{
question:"Pasal dalam UU ITE mengatur tentang....",
options:["Aktivitas elektronik","Cuaca","Olahraga","Pertanian"],
answer:"Aktivitas elektronik",
explanation:"UU ITE mengatur aktivitas dan informasi elektronik."
},

{
question:"Fungsi LOOKUP pada Excel adalah....",
options:["Mencari data","Menghapus data","Menggambar tabel","Membuat video"],
answer:"Mencari data",
explanation:"LOOKUP digunakan mencari data tertentu."
},

{
question:"VLOOKUP digunakan untuk....",
options:["Mencari data vertikal","Menggambar grafik","Menghapus sheet","Mematikan Excel"],
answer:"Mencari data vertikal",
explanation:"VLOOKUP mencari data secara vertikal."
},

{
question:"Fungsi MATCH pada Excel adalah....",
options:["Mencari posisi data","Menghapus workbook","Mengganti warna","Menambah gambar"],
answer:"Mencari posisi data",
explanation:"MATCH digunakan mencari posisi suatu data."
},

{
question:"Yang termasuk fitur Excel adalah....",
options:["Formula Bar","Brush Tool","Timeline","Layer"],
answer:"Formula Bar",
explanation:"Formula Bar merupakan fitur di Excel."
},

{
question:"Blockly Games digunakan untuk....",
options:["Belajar coding","Mengedit foto","Membuat musik","Menonton film"],
answer:"Belajar coding",
explanation:"Blockly Games membantu belajar pemrograman."
},

{
question:"Cara mengganti background di Scratch adalah....",
options:["Klik Choose a Backdrop","Klik Save","Klik Zoom","Klik Delete"],
answer:"Klik Choose a Backdrop",
explanation:"Background diubah melalui menu Choose a Backdrop."
},

{
question:"Teknologi digital memudahkan....",
options:["Komunikasi","Tidur","Berjalan","Makan"],
answer:"Komunikasi",
explanation:"Teknologi digital membantu komunikasi lebih cepat."
},

{
question:"Data adalah....",
options:["Kumpulan fakta","Kumpulan suara","Kumpulan gambar","Kumpulan lagu"],
answer:"Kumpulan fakta",
explanation:"Data merupakan fakta mentah yang dapat diolah."
},

{
question:"Cara membuka Excel yang salah adalah....",
options:["Mematikan komputer","Klik Start","Klik ikon Excel","Cari di Search"],
answer:"Mematikan komputer",
explanation:"Mematikan komputer bukan cara membuka Excel."
},

{
question:"Dampak link berbahaya adalah....",
options:["Pencurian data","Menambah RAM","Menghemat baterai","Mempercepat komputer"],
answer:"Pencurian data",
explanation:"Link berbahaya dapat mencuri data pengguna."
}

];

let currentQuestion = 0;
let userAnswers = Array(questions.length).fill(null);

const questionNumber = document.getElementById("question-number");
const questionText = document.getElementById("question");
const optionsDiv = document.getElementById("options");
const progressBar = document.getElementById("progressBar");

function loadQuestion(){

const q = questions[currentQuestion];

questionNumber.innerHTML = `Soal ${currentQuestion + 1} dari ${questions.length}`;
questionText.innerHTML = q.question;

optionsDiv.innerHTML = "";

q.options.forEach(option => {

const optionDiv = document.createElement("div");
optionDiv.classList.add("option");

optionDiv.innerHTML = `
<label>
<input type="radio" name="option" value="${option}"
${userAnswers[currentQuestion] === option ? "checked" : ""}
>
${option}
</label>
`;

optionDiv.onclick = () => {
document.querySelectorAll('input[name="option"]').forEach(r=>r.checked=false);
optionDiv.querySelector('input').checked=true;
userAnswers[currentQuestion]=option;
};

optionsDiv.appendChild(optionDiv);

});

updateProgress();
}

function nextQuestion(){
if(currentQuestion < questions.length -1){
currentQuestion++;
loadQuestion();
}
}

function prevQuestion(){
if(currentQuestion > 0){
currentQuestion--;
loadQuestion();
}
}

function updateProgress(){
const progress = ((currentQuestion+1)/questions.length)*100;
progressBar.style.width = progress + "%";
}

function submitQuiz(){

let correct = 0;
let wrong = 0;

let reviewHTML = "";

questions.forEach((q,index)=>{

const user = userAnswers[index];

if(user === q.answer){
correct++;
}else{
wrong++;

reviewHTML += `
<div class="review-box">
<div class="review-question">
<h3>Soal ${index+1}</h3>
<p>${q.question}</p>

<p class="wrong">
Jawaban Anda: ${user ? user : "Tidak dijawab"}
</p>

<p class="correct">
Jawaban Benar: ${q.answer}
</p>

<div class="explanation">
<b>Pembahasan:</b> ${q.explanation}
</div>

</div>
</div>
`;
}

});

const score = Math.round((correct/questions.length)*100);

document.getElementById("quiz-container").style.display="none";
document.getElementById("result-container").style.display="block";

document.getElementById("score").innerHTML = score;
document.getElementById("summary").innerHTML =
`Benar: ${correct} | Salah: ${wrong}`;

document.getElementById("review").innerHTML = reviewHTML;

}

loadQuestion();

let timeLeft = 60 * 60;

function updateTimer(){

let minutes = Math.floor(timeLeft / 60);
let seconds = timeLeft % 60;

seconds = seconds < 10 ? "0"+seconds : seconds;

document.getElementById("timer").innerHTML =
`${minutes}:${seconds}`;

if(timeLeft > 0){
timeLeft--;
}else{
submitQuiz();
}

}

setInterval(updateTimer,1000);

</script>

</body>
</html>
