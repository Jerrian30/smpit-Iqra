    }

    .container {

      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);

    h1 {

      color: #333;

    .question {
      margin-bottom: 25px;
      padding: 15px;
      border-bottom: 1px solid #ddd;
    }

    .question h3 {
      margin-bottom: 10px;
    }

    label {
      display: block;
      margin: 5px 0;
      cursor: pointer;
    }

    button {
      display: block;
      margin: 20px auto;
      padding: 12px 25px;
      border: none;
      background: #007bff;
      color: white;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #0056b3;
    }

    #result {
      text-align: center;
      font-size: 22px;
      margin-top: 20px;
      font-weight: bold;
    }

    .correct {
      color: green;
    }

    .wrong {
      color: red;
    }
  </style>
</head>

const quizForm = document.getElementById("quizForm");

questions.forEach((item,index)=>{
  let div = document.createElement("div");
  div.classList.add("question");

  let html = `<h3>${item.q}</h3>`;

  item.o.forEach(option=>{
    html += `
      <label>
        <input type="radio" name="q${index}" value="${option}">
        ${option}
      </label>
    `;
  });

  div.innerHTML = html;
  quizForm.appendChild(div);
});

function checkAnswers(){
  let score = 0;

  questions.forEach((item,index)=>{
    let answer = document.querySelector(`input[name="q${index}"]:checked`);

    if(answer && answer.value === item.a){
      score++;
    }
  });

  document.getElementById("result").innerHTML =
    `Nilai Anda: ${score} / 50`;
}
</script>
