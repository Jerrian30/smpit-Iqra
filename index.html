<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Simulasi Ujian Informatika SMP</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    background:#f4f7fb;
    color:#333;
}

.container{
    max-width:900px;
    margin:30px auto;
    background:white;
    padding:25px;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,0.1);
}

h1{
    text-align:center;
    margin-bottom:10px;
    color:#1e3a8a;
}

.info{
    display:flex;
    justify-content:space-between;
    margin-bottom:20px;
    flex-wrap:wrap;
    gap:10px;
}

.timer{
    background:#ef4444;
    color:white;
    padding:10px 15px;
    border-radius:10px;
    font-weight:bold;
}

.progress-container{
    width:100%;
    height:20px;
    background:#ddd;
    border-radius:10px;
    overflow:hidden;
    margin-bottom:20px;
}

.progress-bar{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,#3b82f6,#06b6d4);
    transition:0.3s;
}

.question-box{
    margin-bottom:20px;
}

.question{
    font-size:20px;
    font-weight:bold;
    margin-bottom:15px;
}

.option{
    background:#f1f5f9;
    padding:12px;
    margin-bottom:10px;
    border-radius:10px;
    cursor:pointer;
    transition:0.2s;
}

.option:hover{
    background:#dbeafe;
}

.option input{
    margin-right:10px;
}

.navigation{
    display:flex;
    justify-content:space-between;
    margin-top:20px;
}

button{
    padding:12px 20px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    font-weight:bold;
    color:white;
}

.prev-btn{
    background:#64748b;
}

.next-btn{
    background:#2563eb;
}

.submit-btn{
    background:#16a34a;
    width:100%;
    margin-top:20px;
}

.result{
    display:none;
}

.correct{
    background:#dcfce7 !important;
    border:2px solid #22c55e;
}

.wrong{
    background:#fee2e2 !important;
    border:2px solid #ef4444;
}

.review-box{
    margin-top:20px;
    padding:15px;
    border-radius:10px;
    background:#f8fafc;
}

@media(max-width:768px){
    .question{
        font-size:18px;
    }
}
</style>
</head>

<body>

<div class="container">

<h1>Simulasi Ujian Informatika</h1>

<div class="info">
<div><b>SMP Negeri 21 Kota Bengkulu</b></div>
<div class="timer" id="timer">60:00</div>
</div>

<div class="progress-container">
<div class="progress-bar" id="progressBar"></div>
</div>

<div id="quiz-container"></div>

<div class="navigation">
<button class="prev-btn" onclick="prevQuestion()">Previous</button>
<button class="next-btn" onclick="nextQuestion()">Next</button>
</div>

<button class="submit-btn" onclick="submitQuiz()">Submit</button>

<div class="result" id="result"></div>

</div>

<script>

const questions = [

{
question:"1. Bahasa pemrograman prosedural mulai berkembang pesat sekitar tahun...",
options:["1940-an","1950-an","1980-an","2000-an"],
answer:"B",
explanation:"Bahasa pemrograman prosedural berkembang pesat pada tahun 1950-an."
},

{
question:"2. Penyusunan data pada Microsoft Excel berbentuk...",
options:["Paragraf","Baris dan kolom","Gambar","Diagram"],
answer:"B",
explanation:"Excel menyusun data dalam bentuk baris dan kolom."
},

{
question:"3. Sel (cell) pada Excel adalah...",
options:["Kumpulan workbook","Pertemuan baris dan kolom","Menu utama","Grafik"],
answer:"B",
explanation:"Cell adalah pertemuan antara baris dan kolom."
},

{
question:"4. Generalisasi dalam berpikir komputasional berarti...",
options:["Menghafal","Mencari pola umum","Menggambar","Menyalin data"],
answer:"B",
explanation:"Generalisasi digunakan untuk menemukan pola umum."
},

{
question:"5. Pengurutan data dari kecil ke besar disebut...",
options:["Ascending","Descending","Copy","Paste"],
answer:"A",
explanation:"Ascending berarti urutan naik."
},

{
question:"6. Tujuan visualisasi data adalah...",
options:["Memperumit data","Mempermudah memahami data","Menghapus data","Menyimpan data"],
answer:"B",
explanation:"Visualisasi data membantu memahami informasi."
},

{
question:"7. Transformasi data adalah...",
options:["Menghapus data","Mengubah bentuk data","Menyembunyikan data","Membuat virus"],
answer:"B",
explanation:"Transformasi data berarti mengubah format atau bentuk data."
},

{
question:"8. Shapes pada Microsoft Office digunakan untuk...",
options:["Menggambar bentuk","Menghapus file","Memainkan musik","Mengubah wallpaper"],
answer:"A",
explanation:"Shapes digunakan untuk membuat bentuk."
},

{
question:"9. Analisis data bertujuan untuk...",
options:["Mengacak data","Mendapatkan informasi","Menghapus file","Memperkecil layar"],
answer:"B",
explanation:"Analisis data membantu memperoleh informasi penting."
},

{
question:"10. Database adalah...",
options:["Kumpulan data","Program game","Perangkat keras","Jaringan internet"],
answer:"A",
explanation:"Database merupakan kumpulan data yang terorganisir."
},

{
question:"11. Website resmi Scratch adalah...",
options:["scratch.mit.edu","google.com","youtube.com","office.com"],
answer:"A",
explanation:"Scratch dapat diakses di scratch.mit.edu."
},

{
question:"12. Scratch digunakan untuk...",
options:["Memasak","Membuat animasi/program","Menggambar manual","Mengetik surat"],
answer:"B",
explanation:"Scratch digunakan untuk membuat animasi dan program."
},

{
question:"13. Program aplikasi berfungsi untuk...",
options:["Mengatur hardware","Membantu pekerjaan pengguna","Merusak komputer","Menyimpan virus"],
answer:"B",
explanation:"Aplikasi membantu pengguna menyelesaikan pekerjaan."
},

{
question:"14. Algoritma adalah...",
options:["Bahasa Inggris","Langkah-langkah penyelesaian masalah","Virus komputer","Nama perangkat"],
answer:"B",
explanation:"Algoritma adalah urutan langkah logis."
},

{
question:"15. Kekurangan Scratch adalah...",
options:["Sulit dipahami pemula","Tampilan visual terbatas","Tidak memiliki blok","Tidak bisa online"],
answer:"B",
explanation:"Scratch memiliki keterbatasan visual tertentu."
},

{
question:"16. Kata komputer berasal dari kata 'compute' yang berarti...",
options:["Menggambar","Menghitung","Menulis","Menyimpan"],
answer:"B",
explanation:"Compute berarti menghitung."
},

{
question:"17. Informatika adalah ilmu tentang...",
options:["Olahraga","Pengolahan informasi","Memasak","Musik"],
answer:"B",
explanation:"Informatika mempelajari pengolahan informasi."
},

{
question:"18. Contoh software adalah...",
options:["Keyboard","Mouse","Microsoft Word","Printer"],
answer:"C",
explanation:"Microsoft Word termasuk software."
},

{
question:"19. Tanda '=' pada Excel digunakan untuk...",
options:["Menghapus data","Memulai rumus","Membuat tabel","Mengganti warna"],
answer:"B",
explanation:"Rumus Excel selalu diawali tanda '='."
},

{
question:"20. Workbook pada Excel adalah...",
options:["Lembar kerja","File Excel","Kolom","Baris"],
answer:"B",
explanation:"Workbook adalah file Excel."
},

{
question:"21. Penulisan rumus Excel yang benar adalah...",
options:["SUM(A1:A5)","=SUM(A1:A5)","SUM=A1:A5","A1+A5="],
answer:"B",
explanation:"Rumus harus diawali tanda '='."
},

{
question:"22. Langkah awal membuat program adalah...",
options:["Mencetak program","Membuat algoritma","Menghapus file","Menggambar"],
answer:"B",
explanation:"Program dimulai dengan algoritma."
},

{
question:"23. Dampak bullying digital adalah...",
options:["Meningkatkan percaya diri","Menyakiti mental korban","Membuat sehat","Mempercepat internet"],
answer:"B",
explanation:"Bullying dapat merusak mental korban."
},

{
question:"24. Cyberlaw di Indonesia diatur dalam...",
options:["UU ITE","UUD 1945","KUHP","UU Pajak"],
answer:"A",
explanation:"Cyberlaw diatur dalam UU ITE."
},

{
question:"25. Dunia virtual adalah...",
options:["Lingkungan digital","Lingkungan nyata","Lapangan","Pasar"],
answer:"A",
explanation:"Dunia virtual merupakan lingkungan digital."
},

{
question:"26. Contoh content communities adalah...",
options:["YouTube","Wikipedia","TikTok","Instagram"],
answer:"B",
explanation:"Wikipedia termasuk content communities."
},

{
question:"27. Media sosial adalah...",
options:["Media komunikasi online","Perangkat keras","Kabel jaringan","Mesin printer"],
answer:"A",
explanation:"Media sosial digunakan untuk komunikasi online."
},

{
question:"28. Ciri media sosial adalah...",
options:["Tidak bisa interaksi","Interaktif","Tidak ada pengguna","Offline"],
answer:"B",
explanation:"Media sosial bersifat interaktif."
},

{
question:"29. Bullying adalah...",
options:["Kerja sama","Perundungan","Belajar kelompok","Diskusi"],
answer:"B",
explanation:"Bullying berarti perundungan."
},

{
question:"30. UU ITE mengatur tentang...",
options:["Teknologi informasi","Olahraga","Kesehatan","Pertanian"],
answer:"A",
explanation:"UU ITE mengatur teknologi informasi dan transaksi elektronik."
},

{
question:"31. Fungsi LOOKUP digunakan untuk...",
options:["Mencari data","Menghapus data","Membuat gambar","Memainkan video"],
answer:"A",
explanation:"LOOKUP digunakan mencari data."
},

{
question:"32. VLOOKUP digunakan untuk...",
options:["Mencari data vertikal","Mencari warna","Menggambar tabel","Menghapus workbook"],
answer:"A",
explanation:"VLOOKUP mencari data secara vertikal."
},

{
question:"33. Fungsi MATCH digunakan untuk...",
options:["Menentukan posisi data","Menghapus kolom","Mengganti warna","Menggambar grafik"],
answer:"A",
explanation:"MATCH digunakan mencari posisi data."
},

{
question:"34. Fitur Excel untuk membuat grafik adalah...",
options:["Chart","Shapes","Review","Mailing"],
answer:"A",
explanation:"Chart digunakan membuat grafik."
},

{
question:"35. Blockly Games berfungsi untuk...",
options:["Belajar coding","Menonton video","Membuat surat","Mengedit foto"],
answer:"A",
explanation:"Blockly Games membantu belajar coding."
},

{
question:"36. Cara mengganti background di Scratch adalah...",
options:["Choose a Backdrop","Delete Sprite","Save File","Duplicate"],
answer:"A",
explanation:"Background diganti melalui Choose a Backdrop."
},

{
question:"37. Teknologi digital mempermudah...",
options:["Komunikasi","Kemacetan","Polusi","Kerusakan"],
answer:"A",
explanation:"Teknologi digital mempermudah komunikasi."
},

{
question:"38. Data adalah...",
options:["Fakta mentah","Permainan","Gambar acak","Suara"],
answer:"A",
explanation:"Data merupakan fakta mentah."
},

{
question:"39. Cara membuka Excel yang salah adalah...",
options:["Melalui Start Menu","Klik file Excel","Melalui Paint","Search Excel"],
answer:"C",
explanation:"Paint bukan aplikasi untuk membuka Excel."
},

{
question:"40. Dampak link berbahaya adalah...",
options:["Komputer aman","Pencurian data","Internet cepat","Memori bertambah"],
answer:"B",
explanation:"Link berbahaya dapat mencuri data."
}

];

let currentQuestion = 0;
let answers = new Array(questions.length).fill(null);

const quizContainer = document.getElementById("quiz-container");

function loadQuestion(){

const q = questions[currentQuestion];

let html = `
<div class="question-box">
<div class="question">${q.question}</div>
`;

q.options.forEach((opt,index)=>{

const letter = ["A","B","C","D"][index];

html += `
<label class="option">
<input type="radio" name="answer" value="${letter}"
${answers[currentQuestion]===letter ? "checked":""}>
${letter}. ${opt}
</label>
`;

});

html += `</div>`;

quizContainer.innerHTML = html;

updateProgress();

document.querySelectorAll('input[name="answer"]').forEach(input=>{
input.addEventListener('change',()=>{
answers[currentQuestion]=input.value;
});
});

}

function nextQuestion(){
if(currentQuestion < questions.length-1){
currentQuestion++;
loadQuestion();
}
}

function prevQuestion(){
if(currentQuestion > 0){
currentQuestion--;
loadQuestion();
}
}

function updateProgress(){
const answered = answers.filter(a=>a!==null).length;
const percent = (answered/questions.length)*100;
document.getElementById("progressBar").style.width = percent+"%";
}

function submitQuiz(){

let score = 0;
let wrongHTML = "";

questions.forEach((q,index)=>{

if(answers[index]===q.answer){
score++;
}else{

wrongHTML += `
<div class="review-box">
<h3>Soal ${index+1}</h3>
<p><b>${q.question}</b></p>
<p class="wrong">Jawaban Anda: ${answers[index] || "Tidak dijawab"}</p>
<p class="correct">Jawaban Benar: ${q.answer}</p>
<p><b>Pembahasan:</b> ${q.explanation}</p>
</div>
`;

}

});

const finalScore = Math.round((score/questions.length)*100);

document.getElementById("result").style.display="block";

document.getElementById("result").innerHTML = `
<h2>Hasil Ujian</h2>
<br>
<p><b>Nilai Akhir:</b> ${finalScore}</p>
<p><b>Benar:</b> ${score}</p>
<p><b>Salah:</b> ${questions.length-score}</p>
${wrongHTML}
`;

window.scrollTo(0,document.body.scrollHeight);

}

loadQuestion();


// TIMER

let time = 60 * 60;

const timer = document.getElementById("timer");

const countdown = setInterval(()=>{

let minutes = Math.floor(time/60);
let seconds = time%60;

seconds = seconds < 10 ? "0"+seconds : seconds;

timer.innerHTML = `${minutes}:${seconds}`;

time--;

if(time < 0){
clearInterval(countdown);
submitQuiz();
}

},1000);

</script>

</body>
</html>
