function shuffleArray(array){
  for(let i = array.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
  return array;
}

questions.forEach(question => {
  let combined = question.options.map((option, index) => ({
    text: option,
    correct: question.answer.includes(index)
  }));

  shuffleArray(combined);

  question.options = combined.map(item => item.text);
  question.answer = combined
    .map((item, index) => item.correct ? index : null)
    .filter(item => item !== null);
});

const form = document.getElementById('quizForm');

questions.forEach((item, index) => {
  const div = document.createElement('div');
  div.className = 'question';

  let html = `<h3>${index + 1}. ${item.q}</h3>`;
  html += `<div class="level">${item.level}</div>`;

  item.options.forEach((opt, i) => {
    if(item.type === 'single'){
      html += `
        <label>
          <input type="radio" name="q${index}" value="${i}">
          ${opt}
        </label>`;
    } else {
      html += `
        <label>
          <input type="checkbox" name="q${index}" value="${i}">
          ${opt}
        </label>`;
    }
  });

  html += `<div id="feedback${index}"></div>`;

  div.innerHTML = html;
  form.appendChild(div);
});

function arraysEqual(a,b){
  return JSON.stringify(a.sort()) === JSON.stringify(b.sort());
}

function submitQuiz(){
  let score = 0;

  questions.forEach((item, index) => {
    let selected = [];

    if(item.type === 'single'){
      const checked = document.querySelector(`input[name=q${index}]:checked`);
      if(checked) selected.push(parseInt(checked.value));
    } else {
      document.querySelectorAll(`input[name=q${index}]:checked`).forEach(el => {
        selected.push(parseInt(el.value));
      });
    }

    const feedback = document.getElementById(`feedback${index}`);

    if(arraysEqual(selected, item.answer)){
      score++;
      feedback.innerHTML = `<div class="correct">✔ Jawaban Benar</div>`;
    } else {
      let correctAnswers = item.answer.map(i => item.options[i]).join(', ');
      feedback.innerHTML = `
        <div class="wrong">
          ✘ Jawaban Salah <br>
          Jawaban benar: <b>${correctAnswers}</b>
        </div>`;
    }
  });

  let finalScore = Math.round((score / questions.length) * 100);
  document.getElementById('result').innerHTML = `Nilai Anda: ${finalScore} / 100`;

  window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
